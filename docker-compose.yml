version: '3.8'

services:
  # ── 1. NGINX ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: strive_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/var/www/frontend/dist
      - ./backend/public:/var/www/backend/public
    depends_on:
      - laravel-api
    networks:
      - strive_network
    restart: unless-stopped

  # ── 2. REACT APP ──────────────────────────────────────
  react-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: strive_react
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost/api
    networks:
      - strive_network
    restart: unless-stopped
    profiles:
      - docker-react 

  # ── 3. LARAVEL API ────────────────────────────────────
  laravel-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: strive_laravel
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/backend
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:7ogi7zfiX6OcCG1McFhsLAYebILhrzaUlZHgs/qjIdo=
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=strive_pilates
      - DB_USERNAME=strive_user
      - DB_PASSWORD=StrivePass2025!
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - SANCTUM_STATEFUL_DOMAINS=localhost,localhost:3000,127.0.0.1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - strive_network
    restart: unless-stopped

  # ── 4. MYSQL ──────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: strive_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: RootPass2025!
      MYSQL_DATABASE: strive_pilates
      MYSQL_USER: strive_user
      MYSQL_PASSWORD: StrivePass2025!
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - strive_network
    restart: unless-stopped

  # ── 5. PHPMYADMIN (DEV ONLY) ──────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: strive_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: strive_user
      PMA_PASSWORD: StrivePass2025!
    depends_on:
      - mysql
    networks:
      - strive_network
    restart: unless-stopped
    profiles:
      - dev

  # ── 6. REDIS ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: strive_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - strive_network
    restart: unless-stopped

  # ── 7. LARAVEL SCHEDULER ──────────────────────────────
  laravel-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: strive_scheduler
    volumes:
      - ./backend:/var/www/backend
    command: php artisan schedule:work
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=strive_pilates
      - DB_USERNAME=strive_user
      - DB_PASSWORD=StrivePass2025!
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      - laravel-api
      - mysql
      - redis
    networks:
      - strive_network
    restart: always

  # ── 8. LARAVEL QUEUE WORKER ───────────────────────────
  laravel-queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: strive_queue
    volumes:
      - ./backend:/var/www/backend
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=strive_pilates
      - DB_USERNAME=strive_user
      - DB_PASSWORD=StrivePass2025!
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      - laravel-api
      - mysql
      - redis
    networks:
      - strive_network
    restart: always

networks:
  strive_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local