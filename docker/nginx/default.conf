server {
    listen 80;
    server_name localhost;

    # ── Security headers ──────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy — izinkan Midtrans Snap & inline script
    add_header Content-Security-Policy "
        default-src 'self';
        script-src  'self' 'unsafe-inline' 'unsafe-eval'
                    https://snap-assets.sandbox.midtrans.com
                    https://api.sandbox.midtrans.com
                    https://pay.google.com
                    https://gwk.gopayapi.com
                    https://www.googletagmanager.com;
        style-src   'self' 'unsafe-inline' https:;
        img-src     'self' data: blob: https:;
        font-src    'self' data: https:;
        frame-src   'self'
                    https://snap-assets.sandbox.midtrans.com
                    https://api.sandbox.midtrans.com;
        connect-src 'self'
                    https://api.sandbox.midtrans.com
                    https://snap-assets.sandbox.midtrans.com
                    https://ulrike-swingable-antwan.ngrok-free.dev
                    ws://localhost:3001 wss://localhost:3001;
    " always;

    # Hide Nginx version
    server_tokens off;

    # Max upload size (foto kelas, banner, dll)
    client_max_body_size 10M;

    # ── API Routes → Laravel ──────────────────────────
    location /api {
        proxy_pass http://laravel-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Storage (uploaded files) → Laravel ───────────
    location /storage {
        proxy_pass http://laravel-api:8000;
        proxy_set_header Host $host;
    }

    # ── Sanctum CSRF → Laravel ────────────────────────
    location /sanctum {
        proxy_pass http://laravel-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── React SPA (semua route lain) ─────────────────
    location / {
        proxy_pass http://react-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket support (Vite HMR development)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Block sensitive files ─────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ \.(env|log|sql|sh)$ {
        deny all;
        return 404;
    }
}
